version: "3.8"

services:
  hyperframes-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyperframes-server
    restart: unless-stopped

    # Resolve o problema de PID 1 e processos zumbi do Chromium
    init: true

    expose:
      - "3031"

    ports:
      - "3030:3030"
      - "3031:3031"

    # Memória compartilhada — obrigatório para o Chromium não crashar.
    # 4gb acomoda múltiplos Chromiums em paralelo (RENDER_WORKERS).
    shm_size: "4gb"

    environment:
      - NODE_ENV=production
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      # URL pública desta porta (3030), por onde a Studio é servida via proxy com o
      # polyfill de secure context injetado. É o que faz salvar edições funcionar
      # em HTTP puro. Enquanto NÃO for definida, o POST /preview continua
      # devolvendo a URL da 3031 (sem polyfill) — a migração é opt-in.
      # Ex: PUBLIC_BASE_URL=http://meu-vps.com:3030
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # URL pública da porta do studio (3031), acesso direto/diagnóstico. Sem o
      # polyfill: salvar por ela só funciona em HTTPS ou localhost.
      - PUBLIC_PREVIEW_URL=${PUBLIC_PREVIEW_URL}
      # A Studio do hyperframes faz bind em 127.0.0.1 por padrão; dentro do container
      # isso a torna inalcançável pelo port-mapping do Docker. 0.0.0.0 expõe em todas
      # as interfaces para que a porta 3031 publicada funcione.
      - HYPERFRAMES_PREVIEW_HOST=0.0.0.0
      # Servidor MCP de autoria em /mcp — dá ao agente do n8n acesso ao contrato de
      # composição e ao catálogo de templates. MCP_ENABLED=false desliga.
      - MCP_ENABLED=${MCP_ENABLED:-true}
      # Reabertura da Studio sobre um preview que ainda está em disco
      # (POST /preview {preview_id}). PREVIEW_REOPEN=false volta ao contrato
      # antigo, em que o POST /preview só aceita `html`.
      - PREVIEW_REOPEN=${PREVIEW_REOPEN:-true}
      # Cache do MCP. Aquecido no build da imagem; o volume abaixo o mantém entre
      # restarts e permite atualizar sem rebuild quando o TTL de 24h vence.
      - MCP_CACHE_DIR=/opt/hf-mcp-cache
      # Workers paralelos de render. A VPS tem 4 cores; o `auto` calibra a frio e trava
      # em 1 worker, mas a captura em regime é rápida. Suba/baixe conforme CPU+RAM.
      # Se ver OOM/crash do Chromium, reduza para 2 (e/ou baixe o shm_size).
      - RENDER_WORKERS=${RENDER_WORKERS:-4}

    volumes:
      # Persiste os jobs em andamento entre restarts
      - hf_jobs:/tmp/hf-jobs
      # Persiste os previews entre restarts
      - hf_previews:/tmp/hf-previews
      # Cache do catálogo/docs do MCP — evita rebuscar o registry a cada restart.
      # O volume nomeado recebe uma cópia do cache assado na imagem na primeira
      # subida e, a partir daí, tem precedência sobre ele. Isso é seguro: o índice
      # do catálogo é chaveado pela revisão do upstream e os docs têm TTL de 24h,
      # então conteúdo velho no volume expira sozinho, nunca é servido como novo.
      - hf_mcp_cache:/opt/hf-mcp-cache

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3030/health').then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  hf_jobs:
  hf_previews:
  hf_mcp_cache:
